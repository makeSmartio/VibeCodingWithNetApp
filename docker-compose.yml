# Passwords have no defaults on purpose: copy .env.example to .env and set real values.
services:
  web:
    build: .
    ports:
      - "8080:80"
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME:-webinar}
      DB_USER: ${DB_USER:-webinar}
      DB_PASS: ${DB_PASS:?Set DB_PASS in .env}
    volumes:
      - .:/var/www/html   # live code for local development; remove for production
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${DB_NAME:-webinar}
      MYSQL_USER: ${DB_USER:-webinar}
      MYSQL_PASSWORD: ${DB_PASS:?Set DB_PASS in .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASS:?Set DB_ROOT_PASS in .env}
      TZ: UTC
    volumes:
      - dbdata:/var/lib/mysql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$$MYSQL_ROOT_PASSWORD\""]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  dbdata:
