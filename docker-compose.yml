services:
  web:
    build: .
    ports:
      - "8080:80"
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME:-webinar}
      DB_USER: ${DB_USER:-webinar}
      DB_PASS: ${DB_PASS:-webinar_pass}
    volumes:
      - .:/var/www/html
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${DB_NAME:-webinar}
      MYSQL_USER: ${DB_USER:-webinar}
      MYSQL_PASSWORD: ${DB_PASS:-webinar_pass}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASS:-root_pass}
      TZ: UTC
    volumes:
      - dbdata:/var/lib/mysql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_ROOT_PASS:-root_pass}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  dbdata:
